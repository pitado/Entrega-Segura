name: Publicar no Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pitou
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar Worker pitou
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '588d6e01a23e320ea62a6f5efe6c1652' }}
    steps:
      - name: Verificar token do Cloudflare
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN não configurado. Publicação ignorada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Instalar dependências
        if: steps.token.outputs.ok == 'true'
        run: npm install --no-audit --no-fund
      - name: Compilar para o Cloudflare
        if: steps.token.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build
      - name: Publicar
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy
