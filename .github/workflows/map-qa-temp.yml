name: Validação temporária do mapa
on:
  push:
    branches:
      - feat/mapa-maplibre-v1
permissions:
  contents: read
jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
