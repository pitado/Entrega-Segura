name: Publicar Entrega Segura na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entrega-segura-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autenticação Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure o segredo CLOUDFLARE_API_TOKEN nas configurações do repositório antes de publicar."
            exit 1
          fi
      - name: Instalar e validar
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Publicar Worker entrega-segura2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "588d6e01a23e320ea62a6f5efe6c1652"
        run: npm run deploy
