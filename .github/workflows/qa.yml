name: Qualidade do Pitou
on:
  push:
    branches: [main, teste-deploy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar Next.js
        run: npm run build

  smoke:
    name: Teste real do Worker e Neon
    needs: build
    # O smoke test valida o Worker publicado, não o código do PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar páginas, APIs e pedido de demonstração
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
        run: npm run test:smoke
